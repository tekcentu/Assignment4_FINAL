[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ce4011-structural-analysis"
version = "0.1.0"
description = "CE4011 Assignment 4 — 2D structural analysis solver with PyQt6 GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyQt6>=6.6",
    # 3D viewport (View -> 3D viewport (beta)). Pure-Python packages;
    # the GUI still degrades gracefully if they are missing at runtime
    # (e.g. a source checkout that predates this entry).
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Back-compat alias: the viewport packages moved into the core
# dependencies in v0.33.1 ("dependency not installed" was the first
# thing every user hit). `pip install .[gl]` keeps working.
gl = [
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.scripts]
structural-analysis-cli = "structural_analysis.main:run_from_file"

[tool.setuptools.packages.find]
include = ["structural_analysis*"]
exclude = ["tests*", "inputs*", "outputs*"]
