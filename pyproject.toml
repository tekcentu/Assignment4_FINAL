[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ce4011-structural-analysis"
version = "0.1.0"
description = "CE4011 Assignment 4 — 2D structural analysis solver with PyQt6 GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
structural-analysis-cli = "structural_analysis.main:run_from_file"

[tool.setuptools.packages.find]
include = ["structural_analysis*"]
exclude = ["tests*", "inputs*", "outputs*"]
